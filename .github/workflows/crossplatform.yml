name: crossplatform

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["crossplatform/**", "flake.nix", "flake.lock", ".github/workflows/crossplatform.yml"]
  pull_request:
    paths: ["crossplatform/**", "flake.nix", "flake.lock", ".github/workflows/crossplatform.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: crossplatform

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, artifact: hearsay-rs-linux-x86_64, binary: hearsay-rs }
          - { name: windows-x86_64, os: windows-latest, artifact: hearsay-rs-windows-x86_64, binary: hearsay-rs.exe }
          - { name: macos-arm64, os: macos-latest, artifact: hearsay-rs-macos-arm64, binary: hearsay-rs }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crossplatform
      - name: Linux build and runtime deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake clang libclang-dev pkg-config \
            libasound2-dev libx11-dev libxi-dev libxtst-dev libxdo-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            xvfb x11-utils xdotool libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6 libxkbcommon-x11-0
      - name: Test
        run: cargo test --workspace
      - name: Build (release, local whisper on, portable CPU flags)
        shell: bash
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/crossplatform/cmake/portable.cmake
        run: |
          # The toolchain file is not in cargo's fingerprint for the whisper-rs-sys build script, so a
          # cached ggml (built native on an earlier run) would be reused. Always rebuild it.
          cargo clean --release -p whisper-rs-sys
          cargo build --release -p hearsay-rs
      - name: Portability check — ggml built without -march=native
        shell: bash
        run: |
          cache=$(find target/release/build -path "*whisper-rs-sys-*" -name CMakeCache.txt | head -1)
          test -n "$cache" || { echo "no CMakeCache.txt under target/release/build"; find target/release/build -maxdepth 1 -name "whisper-rs-sys-*"; exit 1; }
          echo "$cache"; grep -E "^GGML_(NATIVE|AVX2|AVX512):" "$cache"
          grep -qE "^GGML_NATIVE:BOOL=OFF" "$cache" || { echo "GGML_NATIVE is not OFF"; exit 1; }
      - name: Linux headless smoke — window opens, hotkey registers on X11
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1400x900x24 >/tmp/xvfb.log 2>&1 &
          sleep 1
          export DISPLAY=:99 XDG_SESSION_TYPE=x11
          ./target/release/hearsay-rs engines
          (RUST_LOG=info ./target/release/hearsay-rs >/tmp/app.log 2>&1 &)
          sleep 6
          pgrep -f target/release/hearsay-rs >/dev/null || { echo "app died"; cat /tmp/app.log; exit 1; }
          xdotool search --name hearsay >/dev/null || { echo "no window"; cat /tmp/app.log; exit 1; }
          grep -q "hotkey" /tmp/app.log && cat /tmp/app.log | grep -i hotkey || true
          pkill -f target/release/hearsay-rs || true
          echo "runtime shared libraries:"; ldd target/release/hearsay-rs | grep -vE "linux-vdso|libc.so|libm.so|libpthread|libdl|ld-linux|libgcc_s|librt|libstdc\+\+" | awk '{print $1}' | sort
      - name: Windows smoke — engines list
        if: runner.os == 'Windows'
        run: ./target/release/hearsay-rs.exe engines
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/${{ matrix.binary }} dist/
          cp README.md dist/README-hearsay-rs.md
          cp ../LICENSE dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: crossplatform/dist/*
          if-no-files-found: error

  nixos:
    name: nix build (NixOS users)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix build .#hearsay-rs --print-build-logs
      - run: ./result/bin/hearsay-rs engines

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, nixos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Zip per platform
        working-directory: artifacts
        run: for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
      - name: Attach platform archives to the staged draft
        shell: bash
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release: invalid version tag: $RELEASE_TAG" >&2
            exit 1
          }
          native_zip="hearsay-${RELEASE_TAG#v}.zip"
          release="$(gh release view "$RELEASE_TAG" --json isDraft,assets)"
          if ! jq -e --arg zip "$native_zip" --arg checksum "$native_zip.sha256" '
            .isDraft == true
            and any(.assets[]; .name == $zip and .size > 0)
            and any(.assets[]; .name == $checksum and .size > 0)
          ' <<< "$release" >/dev/null; then
            echo "release: expected a draft with $native_zip and $native_zip.sha256; refusing to change published or incomplete releases" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" ./*.zip --clobber
