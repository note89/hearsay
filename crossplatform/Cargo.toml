[workspace]
resolver = "2"
members = ["crates/core", "crates/engines", "crates/backends", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
anyhow = "1"
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
log = "0.4"
hound = "3"
cpal = "0.15"
global-hotkey = "0.6"
enigo = "0.3"
arboard = "3"
eframe = "0.31"
egui = "0.31"
env_logger = "0.11"
