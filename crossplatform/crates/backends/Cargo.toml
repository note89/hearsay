[package]
name = "hearsay-backends"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform mechanisms behind hearsay's concepts: microphone, global hotkey, text insertion"

[dependencies]
hearsay-core = { path = "../core" }
cpal.workspace = true
global-hotkey.workspace = true
enigo.workspace = true
arboard.workspace = true
log.workspace = true
thiserror.workspace = true

# Wayland compositors expose no global hotkey; on Linux the chord can be read from the keyboard devices.
[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
libc = "0.2"
# wlroots compositors (Hyprland, Sway, river) accept virtual-keyboard input; GNOME does not.
enigo = { workspace = true, features = ["wayland", "xdo"] }
wayland-client = "0.31"
